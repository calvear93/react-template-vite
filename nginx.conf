# the web manifest is not in nginx's mime.types: with its own type it is
# compressed (gzip_types) and gets a charset (charset_types)
types {
	application/manifest+json webmanifest;
}

# a built asset has a hash of its content in its name: the same name is always
# the same file, so a browser keeps it for a year without asking again. Only
# when it was served: a 404 (a chunk that a deploy replaced) kept for a year
# would break the app for that browser
map $status $asset_cache_control {
	200 "public, max-age=31536000, immutable";
	default "";
}

# per-file caching as variables: an add_header inside a location drops every
# add_header of the server block, so all headers live there and the values
# that differ per file come from these maps (an empty value skips the header).
# HTML (also every SPA route, which try_files serves as /index.html) is never
# cached; the hashed assets are, for good; every other file (the icons,
# ui-theme-init.js, sw.js, the manifest: names that never change) keeps the
# browser's default caching, which asks again with the ETag
map $uri $cache_control {
	"~*\.html$" "no-cache, no-store, must-revalidate";
	"~^/assets/" $asset_cache_control;
	default "";
}

map $uri $pragma {
	"~*\.html$" "no-cache";
	default "";
}

map $uri $expires_header {
	"~*\.html$" "0";
	default "";
}

server {
	server_name _;

	listen 8080 default_server;
	listen [::]:8080 default_server;

	root /usr/share/nginx/html;
	index index.html;

	# the build writes UTF-8: say so for every text file, not only for HTML
	charset utf-8;
	charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

	# caching
	add_header Cache-Control $cache_control always;
	add_header Pragma $pragma always;
	add_header Expires $expires_header always;
	# Vary: Accept-Encoding comes from gzip_vary below

	# security headers, on every response. Third parties (APIs, analytics,
	# maps…) are added to the CSP per project; fonts are self-hosted at build
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;

	# health check route
	location /health {
		access_log off;
		default_type text/plain;
		return 200 "ok";
	}

	# additional security (before the other regex locations: the first match wins)
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	# a build file that is missing answers 404, never the page: a chunk of the
	# previous deploy answered with index.html would be HTML read as a script
	location ~ ^/(?:assets/.+|[^/]+\.(?:js|css|map|webmanifest))$ {
		try_files $uri =404;
	}

	# SPA routing - serve index.html for all routes
	location / {
		try_files $uri $uri/ /index.html;
	}
}

server_tokens off;

access_log /dev/null;
error_log /dev/null;

# performance optimizations
tcp_nopush on;
tcp_nodelay on;
types_hash_max_size 2048;

# client body optimization
client_max_body_size 16M;
client_body_timeout 60s;
client_header_timeout 60s;

# reduce the data that needs to be sent over network -- for testing environment
gzip on;
gzip_static on;
gzip_min_length 1000;
gzip_comp_level 6;
gzip_vary on;
gzip_disable msie6;
gzip_proxied expired no-cache no-store private auth;
gzip_types
	application/atom+xml
	application/geo+json
	application/javascript
	application/json
	application/ld+json
	application/manifest+json
	application/rdf+xml
	application/rss+xml
	application/vnd.ms-fontobject
	application/woff
	application/x-font-opentype
	application/x-font-ttf
	application/x-javascript
	application/xhtml+xml
	application/xml
	font/eot
	font/opentype
	font/otf
	font/truetype
	font/ttf
	image/svg+xml
	text/css
	text/javascript
	text/plain
	text/xml;
